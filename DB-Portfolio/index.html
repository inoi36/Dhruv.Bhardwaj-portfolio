<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dhruv Bhardwaj | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #00ff41;
      --green-dim: #00b32c;
      --green-dark: #003b0d;
      --bg: #080d08;
      --amber: #ffb000;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#000; font-family:'Share Tech Mono',monospace; overflow:hidden; }

    /* ── Matrix rain canvas ── */
    #matrix-canvas {
      position:fixed; inset:0; z-index:0;
      opacity:0.18;
    }

    /* ── CRT Shell ── */
    .crt-shell {
      width:100vw; height:100vh;
      display:flex; align-items:center; justify-content:center;
      position:relative; z-index:1;
    }

    /* ── Screen wrapper (for perspective tilt) ── */
    .screen-wrap {
      transition: transform 0.1s ease-out;
      position:relative;
    }

    /* ── CRT Screen ── */
    .screen {
      width: min(940px, 96vw);
      height: min(650px, 94vh);
      background: var(--bg);
      border: 2px solid #1f3d1f;
      border-radius: 12px;
      box-shadow:
        0 0 0 8px #060c06,
        0 0 0 10px #0d1a0d,
        0 0 60px rgba(0,255,65,0.2),
        0 0 120px rgba(0,255,65,0.07),
        0 20px 80px rgba(0,0,0,0.9),
        inset 0 0 80px rgba(0,0,0,0.7);
      position:relative; overflow:hidden;
      display:flex; flex-direction:column;
    }

    /* CRT curve overlay */
    .screen-curve {
      position:absolute; inset:0; z-index:20; pointer-events:none;
      border-radius:12px;
      background: radial-gradient(ellipse 100% 100% at 50% 50%,
        transparent 60%,
        rgba(0,0,0,0.5) 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.4);
    }

    /* Chromatic aberration edges */
    .screen-rgb {
      position:absolute; inset:0; z-index:19; pointer-events:none;
      border-radius:12px;
      background:
        linear-gradient(90deg, rgba(255,0,0,0.03) 0%, transparent 8%, transparent 92%, rgba(0,0,255,0.03) 100%),
        linear-gradient(180deg, rgba(255,0,0,0.02) 0%, transparent 6%, transparent 94%, rgba(0,0,255,0.02) 100%);
    }

    /* Scanlines */
    .screen-scanlines {
      position:absolute; inset:0; z-index:18; pointer-events:none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
      );
      border-radius:12px;
    }

    /* Moving bright scanline */
    .screen-sweep {
      position:absolute; left:0; right:0; z-index:17; pointer-events:none;
      height:2px;
      background: linear-gradient(90deg, transparent, rgba(0,255,65,0.15), transparent);
      animation: sweep 5s linear infinite;
      top:0;
    }
    @keyframes sweep { from{top:0%} to{top:100%} }

    /* Flicker */
    .screen { animation: flicker 12s infinite; }
    @keyframes flicker {
      0%,95%,97%,100% { opacity:1; }
      96% { opacity:0.85; }
      96.5%{ opacity:1; }
      98%  { opacity:0.92; }
    }

    /* Power-on animation */
    .screen.poweron {
      animation: poweron 0.6s ease-out forwards, flicker 12s 1s infinite;
    }
    @keyframes poweron {
      0%   { clip-path: inset(50% 0); opacity:0; filter:brightness(3); }
      40%  { clip-path: inset(2% 0);  opacity:1; filter:brightness(2); }
      100% { clip-path: inset(0%);    opacity:1; filter:brightness(1); }
    }

    /* ── Title bar ── */
    .title-bar {
      background: rgba(0,255,65,0.04);
      border-bottom: 1px solid rgba(0,255,65,0.12);
      padding: 9px 18px;
      display:flex; align-items:center; gap:10px;
      flex-shrink:0; z-index:5; position:relative;
    }
    .tb-dots { display:flex; gap:7px; }
    .tb-dot {
      width:11px; height:11px; border-radius:50%;
      background: rgba(0,255,65,0.15);
      border: 1px solid rgba(0,255,65,0.35);
      transition: all 0.2s;
    }
    .tb-dot:hover { background:rgba(0,255,65,0.5); box-shadow:0 0 8px rgba(0,255,65,0.5); }
    .tb-title {
      flex:1; text-align:center;
      color: #2a6b2a; font-size:0.72rem;
      letter-spacing:0.22em; text-transform:uppercase;
    }
    .tb-blink { animation: blink 1s step-end infinite; color:var(--green-dim); }
    @keyframes blink { 50%{opacity:0} }

    /* ── Terminal ── */
    .terminal {
      flex:1; overflow-y:auto; overflow-x:hidden;
      padding:18px 24px;
      color:var(--green);
      font-size:clamp(0.75rem, 1.2vw, 0.88rem);
      line-height:1.7;
      position:relative; z-index:2;
    }
    .terminal::-webkit-scrollbar { width:3px; }
    .terminal::-webkit-scrollbar-thumb { background:var(--green-dark); }

    /* ── Output lines ── */
    .line { display:block; white-space:pre-wrap; word-break:break-word; }
    .dim    { color:#1e4d1e; }
    .muted  { color:#3d8c3d; }
    .bright { color:var(--green); text-shadow:0 0 8px rgba(0,255,65,0.6); }
    .accent { color:var(--amber); }
    .err    { color:#ff4444; }
    .info   { color:#4fc3f7; }
    .cmdecho{ color:var(--green); }
    .empty  { display:block; height:0.7em; }

    /* Glitch text effect */
    .glitch {
      position:relative;
      animation: glitch-main 4s infinite;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position:absolute; left:0; top:0;
      width:100%;
    }
    .glitch::before {
      color:#ff0040; clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
      animation:glitch-r 4s infinite; transform:translateX(-2px);
    }
    .glitch::after {
      color:#00ffff; clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
      animation:glitch-b 4s infinite; transform:translateX(2px);
    }
    @keyframes glitch-main {
      0%,90%,100% { transform:none; }
      91% { transform:skewX(-1deg); }
      93% { transform:skewX(1deg); }
      95% { transform:none; }
    }
    @keyframes glitch-r {
      0%,90%,100% { transform:translateX(-2px); opacity:0; }
      91%,94% { transform:translateX(-4px); opacity:0.8; }
    }
    @keyframes glitch-b {
      0%,90%,100% { transform:translateX(2px); opacity:0; }
      92%,95% { transform:translateX(4px); opacity:0.8; }
    }

    /* ASCII art */
    .ascii {
      color:var(--green);
      text-shadow:0 0 10px rgba(0,255,65,0.5), 0 0 20px rgba(0,255,65,0.2);
      font-size:clamp(0.38rem, 0.8vw, 0.65rem);
      line-height:1.2; white-space:pre; display:block;
      animation: asciiPulse 4s ease-in-out infinite;
    }
    @keyframes asciiPulse {
      0%,100% { text-shadow:0 0 10px rgba(0,255,65,0.5), 0 0 20px rgba(0,255,65,0.2); }
      50%     { text-shadow:0 0 16px rgba(0,255,65,0.8), 0 0 35px rgba(0,255,65,0.35), 0 0 60px rgba(0,255,65,0.1); }
    }

    /* Screen-error glitch (on bad command) */
    @keyframes screenGlitch {
      0%   { filter:none; }
      10%  { filter:hue-rotate(90deg) brightness(1.5); transform:translateX(3px); }
      20%  { filter:none; transform:translateX(-2px); }
      30%  { filter:saturate(2) hue-rotate(-20deg); transform:none; }
      100% { filter:none; transform:none; }
    }
    .screen.glitching { animation: screenGlitch 0.35s ease forwards; }

    /* ── Input row ── */
    .input-row {
      flex-shrink:0;
      border-top:1px solid rgba(0,255,65,0.1);
      padding:6px 24px 11px;
      display:flex; flex-direction:column;
      background:rgba(0,255,65,0.015);
      position:relative; z-index:5;
    }
    .prompt-top { font-size:0.84rem; line-height:1.6; color:#1e4d1e; }
    .prompt-bottom { display:flex; align-items:center; font-size:0.84rem; line-height:1.4; }
    .input-field {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--green); font-family:'Share Tech Mono',monospace;
      font-size:0.84rem; caret-color:var(--green);
      padding:0; margin:0;
    }
    .input-field::placeholder { color:rgba(0,255,65,0.15); }

    /* ── Misc components ── */
    .cmd-table { display:grid; grid-template-columns:130px 1fr; gap:2px 10px; }
    .cmd-key { color:var(--amber); }
    .cmd-val { color:#3d8c3d; }

    .tag {
      display:inline-block;
      border:1px solid rgba(0,255,65,0.25);
      color:var(--green-dim); padding:1px 9px;
      border-radius:2px; margin:2px 3px 2px 0; font-size:0.75em;
      transition:all 0.15s;
    }
    .tag:hover { border-color:rgba(0,255,65,0.6); color:var(--green); background:rgba(0,255,65,0.05); }

    .bar-row { display:flex; align-items:center; gap:10px; margin:3px 0; }
    .bar-label { min-width:170px; color:#3d8c3d; font-size:0.79rem; }
    .bar-track { flex:1; height:5px; background:var(--green-dark); border-radius:1px; overflow:hidden; }
    .bar-fill  { height:100%; border-radius:1px; width:0%;
                 background:linear-gradient(90deg, var(--green-dim), var(--green));
                 box-shadow:0 0 6px var(--green); transition:width 1s cubic-bezier(0.4,0,0.2,1); }
    .bar-pct   { color:var(--green-dim); font-size:0.75rem; min-width:36px; text-align:right; }

    .crt-link {
      color:var(--green); text-decoration:none;
      border-bottom:1px dashed rgba(0,255,65,0.35);
      transition:all 0.15s; cursor:pointer;
    }
    .crt-link:hover { color:#fff; border-bottom-color:var(--green); text-shadow:0 0 10px rgba(0,255,65,0.9); }

    .crt-copy {
      color:var(--amber);
      border:1px dashed rgba(255,176,0,0.35);
      padding:1px 8px; border-radius:2px; cursor:pointer;
      font-size:0.77em; transition:all 0.15s; user-select:none;
    }
    .crt-copy:hover { background:rgba(255,176,0,0.1); border-color:var(--amber); text-shadow:0 0 6px rgba(255,176,0,0.7); }

    /* ── Support Widget ── */
    .info-btn {
      position:fixed; right:22px; bottom:22px;
      width:40px; height:40px; border-radius:50%;
      background:rgba(0,255,65,0.06);
      border:1px solid rgba(0,255,65,0.3);
      color:var(--green);
      font-family:'Share Tech Mono',monospace;
      font-size:1rem; font-weight:bold;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      z-index:999; transition:all 0.2s;
      box-shadow:0 0 15px rgba(0,255,65,0.1);
    }
    .info-btn:hover {
      background:rgba(0,255,65,0.15);
      box-shadow:0 0 25px rgba(0,255,65,0.3);
      transform:scale(1.08);
    }
    .support-widget {
      position:fixed; right:22px; bottom:72px; width:225px;
      background:#080d08;
      border:1px solid rgba(0,255,65,0.28);
      border-radius:10px; padding:16px 18px;
      z-index:998;
      font-family:'Share Tech Mono',monospace;
      box-shadow:0 0 40px rgba(0,255,65,0.12), 0 8px 40px rgba(0,0,0,0.7);
      transform:scale(0.88) translateY(12px);
      opacity:0; pointer-events:none;
      transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .support-widget.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }
    .sw-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:13px; padding-bottom:10px;
      border-bottom:1px solid rgba(0,255,65,0.1);
    }
    .sw-title { color:var(--green); font-size:0.78rem; letter-spacing:0.12em; text-shadow:0 0 6px rgba(0,255,65,0.4); }
    .sw-close { color:#1e4d1e; cursor:pointer; font-size:0.88rem; transition:color 0.15s; }
    .sw-close:hover { color:var(--green); }
    .sw-row { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:0.8rem; color:#3d8c3d; }
    .sw-icon { width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sw-val  { color:var(--green); margin-left:auto; font-size:0.85rem; text-shadow:0 0 8px rgba(0,255,65,0.5); }
    .eye-scan { animation:eyeScan 2.5s ease-in-out infinite; }
    @keyframes eyeScan { 0%,100%{transform:translateX(-2px)} 50%{transform:translateX(2px)} }
    .sw-like-btn { background:none; border:none; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; width:20px; height:20px; }
    .heart-path { fill:none; stroke:#3d8c3d; stroke-width:1.8; transition:all 0.25s; }
    .sw-like-btn.liked .heart-path { fill:#ff4466; stroke:#ff4466; filter:drop-shadow(0 0 5px #ff4466); animation:heartbeat 0.4s ease; }
    .sw-like-btn:hover .heart-path { stroke:var(--green); }
    @keyframes heartbeat { 0%{transform:scale(1)} 40%{transform:scale(1.45)} 100%{transform:scale(1)} }
    .star-path { fill:none; stroke:#3d8c3d; stroke-width:1.6; stroke-linejoin:round; transition:all 0.2s; }
    .sw-star-link {
      color:#3d8c3d; text-decoration:none; margin-left:auto;
      font-size:0.72rem; border:1px solid rgba(0,255,65,0.18);
      padding:2px 9px; border-radius:3px; transition:all 0.2s; letter-spacing:0.05em;
    }
    .sw-star-link:hover { color:var(--green); border-color:rgba(0,255,65,0.5); background:rgba(0,255,65,0.06); box-shadow:0 0 10px rgba(0,255,65,0.15); }
    .sw-star-link:hover .star-path { stroke:var(--green); fill:rgba(0,255,65,0.12); filter:drop-shadow(0 0 3px rgba(0,255,65,0.6)); }
    .sw-divider { height:1px; background:rgba(0,255,65,0.07); margin:5px 0; }

    @media(max-width:600px) {
      .ascii { font-size:0.3rem; }
      .terminal { padding:10px 13px; font-size:0.71rem; }
      .input-row { padding:6px 13px 10px; }
    }
  </style>
</head>

  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*<>?';
  const fs = 14;
  let cols = Math.floor(window.innerWidth / fs);
  const drops = Array(cols).fill(1);
  function draw(){
    cols = Math.floor(window.innerWidth / fs);
    while(drops.length < cols) drops.push(Math.random()*c.height/fs|0);
    cx.fillStyle = 'rgba(0,0,0,0.05)';
    cx.fillRect(0,0,c.width,c.height);
    cx.font = fs+'px Share Tech Mono, monospace';
    for(let i=0;i<drops.length;i++){
      const t = chars[Math.floor(Math.random()*chars.length)];
      const bright = Math.random() > 0.95;
      cx.fillStyle = bright ? '#ffffff' : (Math.random()>0.8 ? '#00ff41' : '#00b32c');
      cx.fillText(t, i*fs, drops[i]*fs);
      if(drops[i]*fs > c.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw, 45);
})();

let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playKey(){
  try {
    const a = getAudio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 800 + Math.random()*400;
    o.type = 'square';
    g.gain.setValueAtTime(0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+0.06);
    o.start(); o.stop(a.currentTime+0.06);
  } catch(e){}
}
function playEnter(){
  try {
    const a = getAudio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 400;
    o.type = 'square';
    g.gain.setValueAtTime(0.06, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+0.12);
    o.start(); o.stop(a.currentTime+0.12);
  } catch(e){}
}
function playError(){
  try {
    const a = getAudio();
    [220,180,150].forEach((f,i)=>{
      const o = a.createOscillator(); const g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value = f; o.type = 'sawtooth';
      g.gain.setValueAtTime(0.05, a.currentTime+i*0.07);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+i*0.07+0.1);
      o.start(a.currentTime+i*0.07); o.stop(a.currentTime+i*0.07+0.1);
    });
  } catch(e){}
}

  }

}

// ── Input handling ────────────────────────────────
inp.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    playEnter();
    const v=inp.value; inp.value='';
    if(v.trim()) cmdHistory.unshift(v); hIdx=-1;
    run(v);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(hIdx<cmdHistory.length-1){ hIdx++; inp.value=cmdHistory[hIdx]||''; }
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hIdx>0){ hIdx--; inp.value=cmdHistory[hIdx]||''; }
    else{ hIdx=-1; inp.value=''; }
  } else if(e.key==='Tab'){
    e.preventDefault();
    const all=['help','whoami','about','skills','tools','focus','contact','projects','gaming','ls','cat ','neofetch','banner','hack','matrix','clear','exit','sudo','date','uname','pwd','echo'];
    const m=all.find(c=>c.startsWith(inp.value.toLowerCase()));
    if(m) inp.value=m;
  } else if(e.ctrlKey&&e.key==='l'){
    e.preventDefault(); T.innerHTML=''; doBanner(); br(); doHelp(); br(); scroll();
  } else if(e.ctrlKey&&e.key==='c'){
    e.preventDefault(); ln('^C','dim'); br(); scroll(); inp.value='';
  } else {
    if(e.key.length===1) playKey();
  }
});

document.addEventListener('click',()=>inp.focus());
document.addEventListener('keydown', e=>{
  if(document.activeElement!==inp&&!e.ctrlKey&&!e.metaKey&&!e.altKey) inp.focus();
});

  const el=document.getElementById(id); if(!el) return;
  let curr=0; const step=Math.max(1,Math.floor(target/30));
